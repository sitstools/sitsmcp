services:
  app:
    build: .
    container_name: sitsmcp-app
    expose:
      - "8000"
    environment:
      WEB_CONCURRENCY: "2"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sitsmcp-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
