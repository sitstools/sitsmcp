services:
  app:
    build: .
    container_name: sitsmcp-app
    expose:
      - "8000"
    # settings come from .env; see .env.example
    env_file:
      - path: .env
        required: false
    environment:
      # only nginx reaches the app (expose, not ports): trust its X-Forwarded-For
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sitsmcp-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
