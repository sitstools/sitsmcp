[project]
name = "sitsmcp"
version = "0.1.0"
description = "MCP server exposing SITS R package documentation, function reference, and references"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.0",
    "sqlalchemy>=2.0.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.5.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydash>=8.0.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24.0",
    "orjson>=3.10.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
prod = [
    "gunicorn>=23.0.0,<24.0.0",
    "uvicorn>=0.30.0",
    "uvicorn-worker>=0.3.0",
]

[project.scripts]
sitsmcp = "sitsmcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitsmcp"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["_resources"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8 naming
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = "_resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
